<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Drive Player</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M12 4v56l16-28z" fill="%234285F4"/><path d="M12 4l16 28 20-11z" fill="%2334A853"/><path d="M12 60l16-28 20 11z" fill="%23EA4335"/><path d="M48 21L28 32l20 11 8-6a6 6 0 000-10z" fill="%23FBBC04"/></svg>'>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* ============================================================
   디자인 토큰 — 2026-11-18 라이트 모드로 리뉴얼.
   기준: 「케빈의 HTML CSS 스타일 가이드 (Light Mode)」(Notion, AX 지식 및 사례 DB)
   3번(토큰) · 4.1(헤딩 4단) · 6.1/21.1(상단 바) · 17(세그먼티드 필터) 값을 그대로 옮겼다.
   값을 직접 쓰지 않고 여기서만 정한다.
   ============================================================ */
:root{
  /* 색 — 가이드 3번 표 그대로 */
  --bg:#ffffff;       --bg-alt:#f5f5f7;
  --card:#ffffff;     --card-alt:#fbfbfd;
  --line:#d2d2d7;     --line-soft:#e8e8ed;
  --ink:#1d1d1f;      --ink2:#6e6e73;     --ink3:#747479;
  --key:#0071e3;      --key-dark:#1c5fd0; --key-soft:#eaf2ff; --key-line:#b9d3ff;
  --ok:#1a7e4f;       --ok-soft:#e8f6ee;
  --danger:#c4342a;   --danger-soft:#fdeceb;

  /* 곡률 — 카드 / 카드 안 상자 / 읽는 칩 / 누르는 것 */
  --r-card:18px;
  --r-in:12px;
  --r-chip:6px;
  --r-pill:980px;

  /* 헤딩 4단 (4.1) + 본문·메타 */
  --h1:clamp(26px,2.7vw,34px);
  --h2:clamp(20px,2vw,24px);
  --h3:17px;
  --h4:15px;
  --fz-body:14px; --fz-item:13.5px; --fz-meta:12px; --fz-chip:10.5px;

  /* 간격 */
  --sp-1:4px;  --sp-2:8px;  --sp-3:12px;
  --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --pad-side:32px;

  --sans:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
         "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;

  --sh:0 1px 3px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
  --sh-up:0 2px 6px rgba(0,0,0,.06), 0 12px 34px rgba(0,0,0,.09);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-alt);
  color:var(--ink);
  font-family:var(--sans);
  font-size:var(--fz-body);
  line-height:1.5;
  letter-spacing:-.003em;
  word-break:keep-all;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button[disabled]{opacity:.4;cursor:not-allowed}
input{font:inherit}
:focus-visible{outline:2px solid var(--key);outline-offset:2px;border-radius:var(--r-in)}

/* ---------- 공통 컨트롤 ----------
   누르는 것은 pill(--r-pill), 읽기만 하는 라벨은 각진 칩(--r-chip).
   테두리는 border 가 아니라 inset 그림자 — 높이가 늘어 줄이 어긋나지 않게(6.2). */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  height:36px;padding:0 var(--sp-4);
  border-radius:var(--r-pill);
  box-shadow:inset 0 0 0 1px var(--line);
  background:var(--bg);
  font-size:var(--fz-item);font-weight:600;color:var(--ink);
  white-space:nowrap;text-decoration:none;
  transition:background .18s, box-shadow .18s, color .18s, filter .18s;
}
.btn:hover:not([disabled]){background:#e8e8ed;box-shadow:inset 0 0 0 1px #c7c7cc}
/* 화면당 주요 동작 하나만 채운다 */
.btn--go{background:var(--key);color:#fff;box-shadow:none;flex:1}
.btn--go:hover:not([disabled]){background:var(--key);box-shadow:none;filter:brightness(.92)}
.btn--sm{height:30px;padding:0 var(--sp-3);font-size:var(--fz-meta)}

.field{
  width:100%;height:36px;padding:0 var(--sp-3);
  background:var(--bg);color:var(--ink);
  border:0;border-radius:var(--r-in);
  box-shadow:inset 0 0 0 1px var(--line);
  font-size:var(--fz-meta);
  transition:box-shadow .18s;
}
.field:hover{box-shadow:inset 0 0 0 1px #c7c7cc}
.field:focus{box-shadow:inset 0 0 0 2px var(--key);outline:none}
.field::placeholder{color:var(--ink3)}

.label{font-size:var(--fz-meta);font-weight:600;color:var(--ink2)}
.hint{margin:0;font-size:var(--fz-meta);color:var(--ink2);line-height:1.6}
.hint strong{color:var(--ink);font-weight:600}
.row{display:flex;gap:var(--sp-2)}

/* 폴더 패널 속 '고급' — 직접 링크 붙여넣기는 자주 안 써서 기본은 접어 둔다 */
.adv > summary{
  font-size:var(--fz-meta);font-weight:600;color:var(--ink2);
  cursor:pointer;list-style:none;
}
.adv > summary::-webkit-details-marker{display:none}
.adv > summary::before{content:"▸ ";font-size:9px}
.adv[open] > summary::before{content:"▾ "}
.adv > summary:hover{color:var(--ink)}
.adv__body{display:grid;gap:var(--sp-3);margin-top:var(--sp-3)}

/* ---------- 상단 바 (6.1 · 21.1) ----------
   한 줄: 로고 → 카테고리 탭 → 우측 pill 묶음. 반투명 흰 바 + 흐림. */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line-soft);
}
.topbar__in{
  display:flex;align-items:center;gap:22px;
  min-height:56px;padding:0 var(--pad-side);
}
.brand{
  display:flex;align-items:center;gap:var(--sp-2);flex:none;
  margin:0;padding:0;
  font-size:var(--h4);font-weight:700;letter-spacing:-.01em;color:var(--ink);
  transition:opacity .18s;
}
.brand:hover{opacity:.6}
.logo{width:22px;height:22px;flex:none}

/* 카테고리 탭 — 네비탭 14px/700, 활성은 --key-soft + --key-dark */
.cats{
  display:flex;align-items:center;gap:4px;
  min-width:0;overflow-x:auto;scrollbar-width:none;
}
.cats::-webkit-scrollbar{display:none}
.cat{
  flex:0 0 auto;
  padding:7px 13px;border-radius:var(--r-pill);
  font-size:14px;font-weight:700;letter-spacing:-.008em;color:var(--ink);
  white-space:nowrap;
  transition:background .15s, color .15s, transform .1s;
}
.cat:hover:not([disabled]):not(.is-on){background:#e8e8ed}
.cat:active:not([disabled]){transform:scale(.97)}
.cat.is-on{background:var(--key-soft);color:var(--key-dark)}

/* 우측 pill — 12px/500 --ink2, inset 테두리. 묶음 안 간격은 탭 간격과 같은 4px */
.tools{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}
.pill,
.menu > summary{
  display:inline-flex;align-items:center;gap:6px;
  height:30px;padding:0 13px;
  list-style:none;cursor:pointer;
  border-radius:var(--r-pill);
  box-shadow:inset 0 0 0 1px var(--line);
  font-size:var(--fz-meta);font-weight:500;color:var(--ink2);
  white-space:nowrap;
  transition:background .15s, box-shadow .15s, color .15s, transform .1s;
}
.pill:hover:not([disabled]),
.menu > summary:hover{background:#e8e8ed;box-shadow:inset 0 0 0 1px #c7c7cc;color:var(--ink)}
.pill:active:not([disabled]),
.menu > summary:active{transform:scale(.97)}
.menu > summary::-webkit-details-marker{display:none}
.menu > summary::after{content:"▾";font-size:9px}
.menu[open] > summary{background:var(--key);box-shadow:none;color:#fff}
.pill svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

.menu{position:relative}
.menu__panel{
  position:absolute;right:0;top:calc(100% + var(--sp-2));z-index:60;
  width:min(380px, calc(100vw - var(--sp-6)));
  display:grid;gap:var(--sp-3);
  padding:var(--sp-5);
  background:var(--card);
  border-radius:var(--r-card);
  box-shadow:inset 0 0 0 1px var(--line-soft), var(--sh-up);
}

/* 인증 상태 — 읽는 정보 + 누르는 버튼 하나 */
.auth{
  display:flex;align-items:center;gap:6px;
  height:30px;padding:0 3px 0 12px;
  border-radius:var(--r-pill);
  box-shadow:inset 0 0 0 1px var(--line);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink3);flex:none}
.auth[data-on="yes"] .dot{background:var(--ok)}
.auth[data-on="err"] .dot{background:var(--danger)}
.auth__state{font-size:var(--fz-meta);color:var(--ink2);white-space:nowrap}
.auth[data-on="yes"] .auth__state{color:var(--ink)}
.auth .btn--sm{height:24px;padding:0 10px;font-size:11.5px;background:var(--key-soft);color:var(--key-dark);box-shadow:none}
.auth .btn--sm:hover:not([disabled]){background:var(--key);color:#fff;box-shadow:none}

/* 마지막 빌드 — 캐시 때문에 실제로 최신 배포를 보고 있는지 헷갈릴 때가 있어서
   분 단위까지 찍는다. 배포할 때 scripts/deploy.py 가 <time> 을 갱신한다. */
.build{font-size:11px;color:var(--ink3);white-space:nowrap}

/* ---------- 하위 카테고리 — 세그먼티드 컨트롤 (17.2 · 17.4 Apple 실측값) ----------
   캡슐(.seg-ind) 하나가 미끄러지며 선택을 옮긴다. 하위 폴더가 없는 카테고리는 줄째로 감춘다. */
.subbar{
  display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;
  padding:var(--sp-4) var(--pad-side) 0;
  max-width:1600px;margin:0 auto;width:100%;
}
.subbar[hidden]{display:none}
.subbar__title{margin:0;font-size:var(--h3);font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.seg{
  position:relative;display:inline-flex;align-items:center;
  background:var(--line-soft);border-radius:var(--r-pill);padding:4px;
  max-width:100%;overflow-x:auto;scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none}
.seg-ind{
  position:absolute;top:4px;left:4px;height:36px;width:0;
  background:var(--ink);border-radius:var(--r-pill);pointer-events:none;
  transition:left .32s ease-out, width .32s ease-out;
}
.seg-ind.is-instant{transition:none}
.seg-b{
  position:relative;z-index:1;flex:0 0 auto;
  height:36px;padding:0 16px;border-radius:var(--r-pill);
  font-size:14px;font-weight:500;letter-spacing:-.006em;
  color:var(--ink);white-space:nowrap;
  transition:color .2s ease-out;
}
.seg-b.is-on{color:#fff}
.seg-b:not(.is-on):hover:not([disabled]){color:var(--key-dark)}

/* 결과 안내 — 오류 전용(JS say() 참고). 메뉴를 닫아도 보이게 폭 전체에 둔다 */
.note{
  margin:var(--sp-4) auto 0;max-width:1600px;
  padding:0 var(--pad-side);
  font-size:var(--fz-item);
}
.note:empty{display:none}
.note[data-tone="bad"]{color:var(--danger)}
.note[data-tone="ok"]{color:var(--ok)}
.note[data-tone]::before{content:""}

/* ---------- 레이아웃 ---------- */
.wrap{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  gap:var(--sp-5);
  padding:var(--sp-4) var(--pad-side) var(--sp-5);
  align-items:start;
  max-width:1600px;margin:0 auto;
}

/* ---------- 재생 화면 ---------- */
.stage{min-width:0}
/* 재생 정보 줄 — 화면에서는 감춘다(파일명은 우측 재생목록에 이미 있어 중복, 비우면
   그만큼 재생 화면이 커진다). JS가 계속 값을 채우고, 화면 낭독기에는 남는다. */
.slate{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
.frame{
  position:relative;aspect-ratio:16/9;
  background:var(--card);   /* 영상 자체가 검은 바탕(video 태그)을 깐다 — 빈 화면 가장자리에 검은 테가 비치지 않게 */
  border-radius:var(--r-card);
  box-shadow:var(--sh);
  overflow:hidden;
}
/* 원본 화질 재생 — object-fit:contain 이라 비율이 달라도 잘리지 않고 레터박스로 보인다 */
.frame video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.frame audio{width:100%;margin:auto;display:block}
.empty{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--sp-3);text-align:center;padding:var(--sp-6);
  background:var(--card);
}
.empty strong{font-size:var(--h2);font-weight:700;letter-spacing:-.015em;color:var(--ink)}
.empty span{color:var(--ink2);font-size:var(--fz-body);max-width:44ch}
.empty .btn--go{flex:none;margin-top:var(--sp-2)}

/* ---------- 재생목록 ---------- */
.rail{
  background:var(--card);
  border-radius:var(--r-card);
  box-shadow:var(--sh);
  overflow:hidden;
}
/* 재생목록 접기 — 토글은 상단 바에 둔다(레일 안에 두면 접는 순간 되돌릴 방법이 없다) */
.rail-toggle .chev-close{display:none}
body[data-rail="off"] .rail-toggle .chev-open{display:none}
body[data-rail="off"] .rail-toggle .chev-close{display:inline}
body[data-rail="off"] .rail{display:none}
body[data-rail="off"] .wrap{grid-template-columns:minmax(0,1fr)}
.rail__head{
  display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-4) var(--sp-4) var(--sp-3);
}
.rail__title{flex:none;margin:0 auto 0 0;font-size:var(--h4);font-weight:700;color:var(--ink)}
.rail__count{
  font-size:var(--fz-meta);font-weight:500;color:var(--ink2);
  font-variant-numeric:tabular-nums;
}
.rail__sub{
  display:flex;align-items:center;gap:var(--sp-2);
  padding:0 var(--sp-4) var(--sp-3);
  border-bottom:1px solid var(--line-soft);
}
.rail__where{
  min-width:0;flex:1;
  font-size:var(--fz-meta);color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.rail__where b{color:var(--ink);font-weight:600}

/* 이전·다음 — 아이콘만 두어 폭을 아낀다 */
.step{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;flex:none;
  border-radius:var(--r-pill);
  background:var(--bg-alt);color:var(--ink);
  transition:background .15s, color .15s;
}
.step:hover:not([disabled]){background:#e8e8ed}
.step svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}

/* 셔플 — 켜짐은 tinted(--key-soft + --key-dark) */
.toggle{
  display:inline-flex;align-items:center;gap:var(--sp-1);
  height:30px;padding:0 var(--sp-3);
  border-radius:var(--r-pill);
  background:var(--bg-alt);
  font-size:var(--fz-meta);font-weight:600;color:var(--ink2);
  transition:background .15s, color .15s;
}
.toggle:hover:not([disabled]){background:#e8e8ed;color:var(--ink)}
.toggle[aria-pressed="true"]{background:var(--key-soft);color:var(--key-dark)}
.toggle[aria-pressed="true"]:hover:not([disabled]){background:var(--key);color:#fff}
.toggle svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

.search{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4) var(--sp-1)}
.search[hidden]{display:none}
.search__box{position:relative;flex:1;min-width:0;display:block}
/* 정렬 전환 — 두 가지뿐이라 목록을 여는 대신 눌러서 바꾼다 */
.sort{
  flex:none;height:36px;padding:0 var(--sp-3);
  border-radius:var(--r-pill);
  background:var(--bg-alt);
  font-size:var(--fz-meta);font-weight:600;color:var(--ink2);
  white-space:nowrap;
  transition:background .15s, color .15s;
}
.sort:hover:not([disabled]){background:#e8e8ed;color:var(--ink)}
.search input{
  width:100%;height:36px;padding:0 var(--sp-6) 0 var(--sp-3);
  background:var(--bg-alt);color:var(--ink);
  border:0;border-radius:var(--r-in);
  font-size:var(--fz-item);
  transition:box-shadow .18s, background .18s;
  -webkit-appearance:none;appearance:none;
}
.search input:focus{background:var(--bg);box-shadow:inset 0 0 0 2px var(--key);outline:none}
.search input::placeholder{color:var(--ink2)}
.search input::-webkit-search-cancel-button{display:none}
.search__x{
  position:absolute;right:var(--sp-2);top:50%;transform:translateY(-50%);
  display:flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:50%;
  color:var(--ink2);font-size:11px;
}
.search__x[hidden]{display:none}
.search__x:hover{color:var(--ink);background:#e8e8ed}

.list{list-style:none;margin:0;padding:var(--sp-2);max-height:46vh;overflow-y:auto;overscroll-behavior:contain}
.list:empty{display:none}
/* 한 줄 = 한 항목. 목록을 최대한 많이 보여주기 위한 구조 */
.clip{
  display:flex;align-items:center;gap:var(--sp-2);
  width:100%;text-align:left;
  padding:9px var(--sp-3);
  border-radius:var(--r-in);
  transition:background .15s;
}
.clip:hover{background:var(--bg-alt)}
.clip[aria-current="true"]{background:var(--key-soft)}
.clip[aria-current="true"] .clip__no,
.clip[aria-current="true"] .clip__name{color:var(--key-dark)}
.clip__no{
  flex:none;width:24px;
  font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;
}
.clip__name{
  flex:1;min-width:0;
  font-size:var(--fz-item);font-weight:500;line-height:1.4;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.clip[aria-current="true"] .clip__name{font-weight:700}
.clip__dur{
  flex:none;
  font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;
}
/* 읽기 전용 칩 — 각진 6px, 10.5px */
.tag{
  flex:none;
  padding:1px 6px;border-radius:var(--r-chip);
  background:var(--bg-alt);color:var(--ink2);
  font-size:var(--fz-chip);font-weight:600;letter-spacing:.02em;text-transform:uppercase;
}
.tag--warn{background:var(--danger-soft);color:var(--danger);text-transform:none}
.clip--stuck .clip__name{color:var(--ink2);font-weight:400}
.clip--stuck[aria-current="true"] .clip__name{color:var(--danger)}

.list__none{
  margin:0;padding:var(--sp-5) var(--sp-4);
  text-align:center;color:var(--ink2);font-size:var(--fz-item);
}

/* 스크롤바 */
.list::-webkit-scrollbar{width:10px}
.list::-webkit-scrollbar-thumb{background:var(--line);border-radius:var(--r-pill);border:3px solid var(--card)}
.list::-webkit-scrollbar-track{background:transparent}

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ============================================================
   기본값을 채워 두면 페이지를 열자마자 그대로 씁니다.
   CLIENT_ID 를 코드에 넣어두면 보는 사람이 매번 입력할 필요가 없습니다.
   ============================================================ */
const DEFAULT_CLIENT_ID = "526977864557-3rhh9763r87hmi7bcb1f60v88668i3ks.apps.googleusercontent.com";
const DEFAULT_FOLDER    = "";

/* Kevin 라이브러리 루트와 East/West/China/Classic 하위 폴더 — 2026-09-18 고정.
   폴더 주소 입력 없이도 바로 접근할 수 있도록 ID를 기억해 둔다(사용자 요청).
   ID는 Drive에서 폴더를 옮기거나 지우지 않는 한 바뀌지 않는다. */
const KEVIN_ROOT_ID = "1Y5HxbzYS8Fa-AM-5UIZ4-bwp0IOdM_WA";

/* 빠른 폴더 = 큰 카테고리(드롭다운) 2개 — 2026-09-23 개편.
   각 그룹은 '전체'(id, 루트 폴더 — 재귀 스캔이 하위 폴더를 알아서 다 훑는다·MAX_DEPTH 참고)
   와 개별 하위 폴더(children)로 이루어진다. */
const QUICK_GROUPS = [
  {
    name: "일반 동영상",
    id: KEVIN_ROOT_ID,
    children: [
      { name: "East",    id: "11Akt4yA8Y2yp-kLif2LVIO0clk2uCmae" },
      { name: "West",    id: "1YUHOzOz4tHURAZgkmUDH7xCsWtuqVQ68" },
      { name: "Classic", id: "1vRdWOqwo9vDrfw_0rCBLZaNisiaVj_at" },
      { name: "China",   id: "1-GeUUgOUW18QKg1SLHGrBsUVzRp9107h" },
    ],
  },
  {
    name: "바람의 검심",
    id: "1kXlLfbXmGSRey0v99MxjsHaHRsZZQIha",
    children: [
      { name: "메이지 검객 낭만담", id: "18Lo1qywEdxRcECkPFeXoVD4vVxpHisfN" },
      { name: "유신지사의 진혼가", id: "1UlXFpnCOnlxkmEPhniEcCUQc1FZHPVrV" },
      { name: "추억편",           id: "1HNtpraZjUrQLp_sOtW6wcakarL42WKKB" },
      { name: "성상편",           id: "1lRQbpMihD0PhE1pvlJEbBLwmqIzekk9s" },
      { name: "신교토편",         id: "1s4bzRZnz16rR9uJvmlD0C9iHZpsREazO" },
    ],
  },
  /* children이 없는 항목은 세그먼트 줄 없이 탭 하나로 바로 불러온다. */
  { name: "기동전사 건담 제08MS소대", id: "1BLusbZSM16KJxU8gh-QZFflUIpz-_NKy" },
  /* 2026-11-19 추가 — Kevin\Anime (ready-for-encode\Anime 스캔 대상) */
  { name: "Anime", id: "1gnXiI3-JlAWekvplitQ3kCWskcsFC2-1" },
];

function driveFolderUrl(id) { return "https://drive.google.com/drive/folders/" + id; }

/* 폴더 없이 고정 목록을 쓰고 싶을 때만 채우세요. */
let CLIPS = [
  // { name: "예시 영상", id: "1AbCdEfGhIjKlMnOpQrStUvWxYz" },
];

/* metadata.readonly로는 폴더 목록만 읽힌다 — 원본 파일 바이트를 내려받으려면
   (alt=media) drive.readonly 스코프가 필요하다. 스코프를 넓혔으니 기존 연결은
   재동의가 필요하다(설정에서 '연결'을 다시 누르면 됨). */
const SCOPE = "https://www.googleapis.com/auth/drive.readonly";
const API   = "https://www.googleapis.com/drive/v3/files";
const MAX_DEPTH = 3;

const $ = (s) => document.querySelector(s);
const listEl = $("#list"), frameEl = $("#frame");
const titleEl = $("#title"), markEl = $("#mark"), fidEl = $("#fid");
const countEl = $("#count"), noteEl = $("#note");
const authEl = $("#auth"), authStateEl = $("#authState"), signinBtn = $("#signin");

let current = -1;
let token = null;         // { value, expires }
let tokenClient = null;

/* 검색어. 목록 표시뿐 아니라 이전/다음·셔플이 도는 범위도 이 값으로 좁힙니다. */
let filter = "";

/* 정렬 기준: "name"(파일명) 또는 "recent"(최근 수정 순) */
let sortBy = "name";

/* 셔플: 한 바퀴 도는 동안 같은 영상이 다시 나오지 않도록 순서를 미리 섞어 둡니다. */
let shuffleOn = false;
let queue = [];           // 재생 순서(인덱스 배열)
let railOpen = true;      // 재생목록 펼침 여부
let qpos = -1;
let loadedLabel = "";     // 재생목록을 채운 카테고리 이름 (재생목록 머리에 표시)

/* ---------- 저장된 설정 ---------- */
const store = {
  get(k, fallback){ try { return localStorage.getItem(k) ?? fallback; } catch { return fallback; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};
let clientId = DEFAULT_CLIENT_ID || store.get("dp.clientId", "");
$("#cid").value = clientId;
$("#folder").value = DEFAULT_FOLDER || store.get("dp.folderId", "") || driveFolderUrl(KEVIN_ROOT_ID);
if (!clientId) $("#setupBox").open = true;

/* ---------- 링크 파싱 ---------- */
function parseFolderId(input) {
  const s = (input || "").trim();
  if (!s) return null;
  const m = s.match(/\/folders\/([a-zA-Z0-9_-]{10,})/)
        || s.match(/[?&]id=([a-zA-Z0-9_-]{10,})/)
        || s.match(/^([a-zA-Z0-9_-]{20,})$/);
  return m ? m[1] : null;
}

/* ---------- 표시 도우미 ---------- */
/* 안내 줄은 오류일 때만 띄운다.
   "582개를 불러왔습니다" 같은 성공 알림은 한 번 읽고 나면 자리만 차지한다.
   실패는 남긴다 — 조용히 실패하면 사용자가 원인을 알 방법이 없다.
   (.note:empty 가 display:none 이라 비우면 높이도 0이 된다) */
function say(msg, tone) {
  if (tone !== "bad") {
    noteEl.textContent = "";
    noteEl.removeAttribute("data-tone");
    return;
  }
  noteEl.textContent = msg || "";
  noteEl.dataset.tone = "bad";
}
function fmtTime(ms) {
  const total = Math.round(Number(ms) / 1000);
  if (!Number.isFinite(total) || total <= 0) return "";
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
}

/* ---------- 정렬 ---------- */
/* 최신순은 수정 시각 내림차순, 이름순은 한글 기준 오름차순입니다. */
function sortClips(list) {
  return list.sort((a, b) =>
    sortBy === "recent"
      ? (b.mtime || 0) - (a.mtime || 0)
      : a.name.localeCompare(b.name, "ko"));
}

/* 정렬은 CLIPS 배열 자체를 다시 늘어놓기 때문에 인덱스가 전부 바뀝니다.
   current와 셔플 큐가 인덱스를 들고 있으므로, 재생 중인 영상을 id로 다시 찾아
   자리를 맞춰 주지 않으면 엉뚱한 영상으로 건너뜁니다. */
function applySort() {
  const playingId = CLIPS[current] ? CLIPS[current].id : null;
  sortClips(CLIPS);
  current = playingId ? CLIPS.findIndex((c) => c.id === playingId) : -1;
  queue = []; qpos = -1;                       /* 옛 순서로 만든 큐는 버립니다 */
  if (shuffleOn && current >= 0) buildQueue(current);
  render();
  scrollToCurrent();
}

function setSortLabel() {
  $("#sort").textContent = sortBy === "recent" ? "최신순" : "이름순";
  $("#sort").title = sortBy === "recent" ? "최근 수정 순 — 눌러서 이름순으로" : "이름 순 — 눌러서 최신순으로";
}

/* ---------- 목록 렌더 ---------- */
/* 검색어에 걸리는 항목인가 */
function matches(i) {
  if (!filter) return true;
  const c = CLIPS[i];
  return !!c && c.name.toLowerCase().indexOf(filter) >= 0;
}

/* 지금 넘기기(이전/다음·셔플)로 갈 수 있는 항목인가.
   재생되지 않는 영상과 검색에서 빠진 영상을 함께 걸러냅니다. */
function playable(i) {
  return !!CLIPS[i] && CLIPS[i].ready !== false && matches(i);
}

function render() {
  listEl.innerHTML = "";
  const shown = CLIPS.reduce((n, _, i) => n + (matches(i) ? 1 : 0), 0);
  countEl.textContent = filter
    ? shown + " / " + CLIPS.length + "개"
    : CLIPS.length + "개";
  /* 지금 재생목록이 어느 카테고리에서 왔는지 — 빈 칸 대신 이유를 글자로 둔다 */
  const where = $("#where");
  where.textContent = "";
  if (loadedLabel) {
    const b = document.createElement("b");
    b.textContent = loadedLabel;
    where.appendChild(b);
  } else {
    where.textContent = "불러온 카테고리 없음";
  }
  where.title = loadedLabel;

  const searchBox = document.querySelector(".search");
  if (searchBox) searchBox.hidden = CLIPS.length === 0;
  $("#noHit").hidden = !(filter && shown === 0 && CLIPS.length > 0);

  CLIPS.forEach((clip, i) => {
    if (!matches(i)) return;          /* 번호는 원래 위치를 유지합니다 */
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.className = "clip";
    btn.type = "button";
    btn.setAttribute("aria-current", i === current ? "true" : "false");

    /* 한 줄에 담아 목록을 최대한 많이 보여줍니다.
       이름이 길면 잘리지만 마우스를 올리면 전체가 뜹니다. */
    const no = document.createElement("span");
    no.className = "clip__no";
    no.textContent = String(i + 1).padStart(2, "0");

    const nm = document.createElement("span");
    nm.className = "clip__name";
    nm.textContent = clip.name;
    nm.title = clip.name;

    btn.appendChild(no);
    btn.appendChild(nm);

    /* 대부분이 영상이라 video 배지는 자리만 차지합니다. 예외인 것만 표시합니다. */
    if (clip.kind === "audio") {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "audio";
      btn.appendChild(tag);
    }
    /* Drive가 아직 변환하지 못한 영상. 눌러도 "처리 중" 안내만 나오므로 미리 알려준다. */
    if (clip.ready === false) {
      btn.classList.add("clip--stuck");
      const w = document.createElement("span");
      w.className = "tag tag--warn";
      w.textContent = "재생 불가";
      btn.appendChild(w);
    }
    const dur = fmtTime(clip.ms);
    if (dur) {
      const d = document.createElement("span");
      d.className = "clip__dur";
      d.textContent = dur;
      btn.appendChild(d);
    }
    btn.addEventListener("click", () => play(i));
    li.appendChild(btn);
    listEl.appendChild(li);
  });
}

/* ---------- 셔플 ---------- */
function buildQueue(startIdx) {
  const rest = CLIPS.map((_, i) => i).filter((i) => i !== startIdx);
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = rest[i]; rest[i] = rest[j]; rest[j] = t;
  }
  queue = startIdx >= 0 ? [startIdx].concat(rest) : rest;
  qpos = startIdx >= 0 ? 0 : -1;
}

function step(dir) {
  if (!CLIPS.length) return;
  /* 재생되지 않는 영상과 검색에서 빠진 영상은 건너뛴다.
     갈 수 있는 곳이 하나도 없으면 무한히 돌 수 있어 먼저 확인한다. */
  if (!CLIPS.some((_, i) => playable(i))) {
    say(filter ? "검색 결과 중 재생할 수 있는 영상이 없습니다." : "재생할 수 있는 영상이 없습니다.", "bad");
    return;
  }
  /* 아직 아무것도 재생하지 않았으면(current = -1) '이전'은 마지막 곡부터 시작한다 —
     그냥 (current + dir)로 계산하면 마지막에서 두 번째 곡으로 건너뛰었다. */
  if (!shuffleOn && current < 0 && dir < 0) current = 0;
  for (let guard = 0; guard <= CLIPS.length; guard++) {
    if (shuffleOn) {
      if (!queue.length) buildQueue(current);
      let p = qpos + dir;
      if (p >= queue.length) { buildQueue(-1); p = 0; }   // 한 바퀴 끝 → 새로 섞기
      else if (p < 0) p = queue.length - 1;
      qpos = p;
      if (playable(queue[p])) { play(queue[p], true); return; }
    } else {
      current = (current + dir + CLIPS.length) % CLIPS.length;
      if (playable(current)) { play(current); return; }
    }
  }
}

function updateTransport() {
  const none = CLIPS.length === 0;
  $("#prev").disabled = none;
  $("#next").disabled = none;
  $("#shuffle").disabled = none;
  $("#sort").disabled = none;
}

/* 원본 화질 스트리밍.
   video/audio 태그는 커스텀 헤더(Authorization)를 실을 방법이 없다. Drive API로
   원본 바이트를 받으려면 이 헤더가 필수라서(쿼리스트링의 access_token은 Drive API가
   더 이상 받아주지 않는다 — 시도해봤더니 아예 재생이 안 됐다), 같은 출처의
   서비스워커(sw.js)가 "stream/<fileId>" 요청을 가로채 헤더를 붙여 대신 요청하고
   그 응답(Range 지원 포함)을 그대로 돌려준다. 그러면 브라우저의 video 엔진이 평소처럼
   Range 요청을 날리며 진짜 스트리밍·탐색을 한다 — 페이지 JS가 파일 전체를 메모리에
   들고 있지 않아도 되니 iPad·iPhone처럼 메모리가 빠듯한 기기에서도 안전하다. */
let swReadyPromise = null;
function ensureSW() {
  if (!("serviceWorker" in navigator)) return Promise.reject(new Error("NO_SW"));
  if (swReadyPromise) return swReadyPromise;
  swReadyPromise = navigator.serviceWorker.register("sw.js")
    .then(() => navigator.serviceWorker.ready)
    .then(() => {
      if (navigator.serviceWorker.controller) return;
      /* 이 페이지의 첫 로드 — 서비스워커가 설치는 됐지만 아직 이 탭을 제어하지
         않는다. activate에서 clients.claim()을 부르므로 곧 controllerchange가 온다. */
      return new Promise((resolve) => {
        navigator.serviceWorker.addEventListener("controllerchange", resolve, { once: true });
      });
    });
  return swReadyPromise;
}
function postTokenToSW(tok) {
  if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({ type: "token", value: tok });
  }
}
function streamUrl(clip) {
  /* size를 같이 넘기는 이유는 sw.js 쪽 주석 참고 — 서비스워커가 Content-Range를
     직접 계산해서 넣어야 하는데 총 파일 크기를 알아야 한다. */
  return "stream/" + encodeURIComponent(clip.id) + "?size=" + (clip.size || 0);
}

/* action = { label, run } — 오류 화면에 버튼 하나를 붙인다(다시 연결·이어 보기 등).
   버튼 클릭은 사용자 제스처라서, 그 안에서 부르는 Google 로그인 팝업이 차단되지 않는다. */
function showError(clip, msg, retryUrl, action) {
  frameEl.innerHTML = "";
  const box = document.createElement("div");
  box.className = "empty";
  const s = document.createElement("strong");
  s.textContent = action && action.title ? action.title : "재생할 수 없습니다";
  const p = document.createElement("span");
  p.textContent = msg;
  box.appendChild(s); box.appendChild(p);
  if (action) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn btn--go";
    b.style.flex = "none";
    b.textContent = action.label;
    b.addEventListener("click", action.run);
    box.appendChild(b);
  }
  if (retryUrl) {
    const a = document.createElement("a");
    a.className = "btn btn--sm";
    a.href = retryUrl;
    a.download = clip.name;
    a.textContent = "원본 파일 내려받기";
    box.appendChild(a);
  }
  frameEl.appendChild(box);
}

/* 끊긴 자리에서 다시 재생하는 버튼 — 토큰이 만료됐으면 play()가 맨 먼저 getToken을
   부르므로(첫 await 전, 즉 클릭 제스처 안에서) 로그인 팝업이 그대로 뜬다. */
function resumeAction(i, at, title, label) {
  return { title, label, run: () => play(i, true, at) };
}

async function play(i, fromQueue, startAt) {
  const clip = CLIPS[i];
  if (!clip) return;
  /* 목록에서 직접 고르면 그 영상을 기준으로 순서를 다시 섞습니다. */
  if (shuffleOn && !fromQueue) buildQueue(i);
  current = i;
  titleEl.textContent = clip.name;
  markEl.textContent = String(i + 1).padStart(2, "0");
  fidEl.textContent = clip.id;
  render();
  scrollToCurrent();

  let tok;
  try {
    tok = await getToken(false);
    await ensureSW();
  } catch (err) {
    if (current !== i) return;
    if (String(err.message) === "NO_SW") {
      showError(clip, "이 브라우저는 스트리밍에 필요한 기능(Service Worker)을 지원하지 않습니다.");
    } else {
      /* 연속 재생 중 1시간짜리 토큰이 만료되면, 다음 곡으로 넘어갈 때(사용자 클릭이 아니라
         'ended' 이벤트) 로그인 팝업이 차단된다 — 예전엔 여기서 아무 안내 없이 멈춰 있었다.
         버튼을 누르면 그 클릭으로 팝업을 띄우고 이 곡부터 이어서 재생한다. */
      showError(clip, "Google 연결이 만료됐습니다. 아래 버튼을 누르면 다시 연결하고 이 영상부터 재생합니다.",
                null, resumeAction(i, startAt, "다시 연결이 필요합니다", "다시 연결하고 재생"));
    }
    return;
  }
  if (current !== i) return;   // 토큰/서비스워커를 기다리는 동안 다른 곡으로 넘어갔다
  postTokenToSW(tok);

  /* 바로 <video>에 물리면 실패해도 "코덱 문제"인지 "인증 실패"인지 구분이 안 된다.
     1바이트만 미리 요청해서 서비스워커·Drive API가 실제로 뭐라고 답하는지 먼저 확인한다
     — 문제가 있으면 Google이 준 실제 오류 메시지를 그대로 보여준다. */
  let probeStatus = 0, probeBody = "";
  try {
    const probe = await fetch(streamUrl(clip), { headers: { Range: "bytes=0-0" } });
    probeStatus = probe.status;
    if (probeStatus < 200 || probeStatus >= 300) probeBody = await probe.text();
  } catch (err) {
    if (current !== i) return;
    showError(clip, "스트리밍 요청 자체가 실패했습니다 (네트워크 또는 서비스워커 오류): " + (err.message || err));
    return;
  }
  if (current !== i) return;   // 확인하는 동안 다른 곡으로 넘어갔다
  if (probeStatus === 401) {
    /* 우리 시계로는 아직 유효한데 Drive가 거부한 토큰(철회·만료) — 버리고 다시 받는다 */
    token = null;
    setAuth("no", "연결이 만료됨");
    showError(clip, "Google 연결이 만료됐습니다. 아래 버튼을 누르면 다시 연결하고 이 영상부터 재생합니다.",
              null, resumeAction(i, startAt, "다시 연결이 필요합니다", "다시 연결하고 재생"));
    return;
  }
  if (probeStatus < 200 || probeStatus >= 300) {
    showError(clip, "Drive가 재생을 거부했습니다 (HTTP " + probeStatus + ") — " + (probeBody || "(응답 없음)").slice(0, 300));
    say("‘" + clip.name + "’ 재생 실패 (HTTP " + probeStatus + ").", "bad");
    return;
  }

  frameEl.innerHTML = "";
  const el = document.createElement(clip.kind === "audio" ? "audio" : "video");
  el.src = streamUrl(clip);
  el.controls = true;
  el.autoplay = true;
  el.playsInline = true;
  el.title = clip.name;
  /* 이어 보기 — 끊긴 자리로 바로 돌아간다 */
  if (startAt > 1) {
    el.addEventListener("loadedmetadata", () => { el.currentTime = startAt; }, { once: true });
  }
  /* 재생이 끝나면 다음 곡으로 — iframe 미리보기로는 재생 종료를 알 수 없어 못 하던 것이다. */
  el.addEventListener("ended", () => step(1));
  el.addEventListener("error", () => onMediaError(clip, i, el));
  frameEl.appendChild(el);
}

/* 재생 중 오류의 원인 가리기.
   시작할 때 프리플라이트로 인증·서비스워커·Drive 응답을 이미 확인했으므로, 처음부터
   재생이 안 되면 원인은 사실상 코덱이다. 하지만 잘 재생되다가 중간에 멈춘 경우는 다르다 —
   1시간짜리 토큰이 재생 도중 만료되거나 네트워크가 끊기면 다음 Range 요청이 실패하는데,
   예전엔 이것까지 "코덱 미지원"으로 잘못 안내했다. 그래서 오류가 나면 1바이트로 한 번 더
   확인해서 인증 문제/일시적 끊김/코덱 문제를 나눈다. (로그인 팝업을 자동으로 띄우지는
   않는다 — 예전에 곡마다 로그인 창이 반복해서 뜨는 버그가 있었다. 버튼으로만 띄운다.) */
async function onMediaError(clip, i, el) {
  if (current !== i) return;   // 이미 다른 곡으로 넘어간 뒤라면 무시
  const at = el.currentTime || 0;
  let status = 0;
  if (tokenValid()) {
    postTokenToSW(token.value);
    try {
      status = (await fetch(streamUrl(clip), { headers: { Range: "bytes=0-0" } })).status;
    } catch {}
    if (current !== i) return;
  } else {
    status = 401;
  }

  if (status === 401) {
    token = null;
    setAuth("no", "연결이 만료됨");
    showError(clip, "재생 중에 Google 연결(1시간 단위)이 만료됐습니다. 아래 버튼을 누르면 다시 연결하고 멈춘 자리부터 이어서 재생합니다.",
              null, resumeAction(i, at, "연결이 만료되어 멈췄습니다", "다시 연결하고 이어 보기"));
    return;
  }
  if (at > 1 || status < 200 || status >= 300) {
    showError(clip, "재생 중에 연결이 끊겼습니다" + (status ? " (HTTP " + status + ")" : "") + ". 아래 버튼을 누르면 멈춘 자리부터 이어서 재생합니다.",
              null, resumeAction(i, at, "재생이 끊겼습니다", "이어 보기"));
    return;
  }
  showError(clip, "브라우저가 이 영상의 코덱을 지원하지 않습니다. 원본을 내려받아 VLC 등으로 재생해 보세요.", streamUrl(clip));
  say("‘" + clip.name + "’ 코덱을 브라우저가 지원하지 않습니다.", "bad");
}

/* 랜덤 재생은 목록 어디로든 튀므로, 지금 재생 중인 항목을 목록 한가운데로 데려옵니다.
   scrollIntoView 대신 직접 계산하는 이유는 목록만 움직이고 페이지는 건드리지 않기 위해서입니다. */
function scrollToCurrent() {
  const el = listEl.querySelector('.clip[aria-current="true"]');
  if (!el) return;                       /* 검색으로 가려져 있으면 할 일이 없습니다 */
  const box = listEl.getBoundingClientRect();
  const item = el.getBoundingClientRect();
  const target = listEl.scrollTop + (item.top - box.top) - (box.height - item.height) / 2;
  const max = listEl.scrollHeight - listEl.clientHeight;
  /* 목록 처음·끝에서는 더 밀지 않습니다 */
  listEl.scrollTop = Math.max(0, Math.min(target, max));
  /* 부드러운 스크롤을 쓰지 않는 이유: 랜덤 재생은 매번 목록 반대편으로 튀는데
     그 거리를 애니메이션하면 눈이 따라가기 어렵고, 환경에 따라 아예 동작하지 않기도 합니다. */
}

function showEmpty(strong, detail) {
  current = -1;
  frameEl.innerHTML = "";
  const box = document.createElement("div");
  box.className = "empty";
  const s = document.createElement("strong");
  s.textContent = strong;
  const p = document.createElement("span");
  p.textContent = detail;
  box.appendChild(s); box.appendChild(p);
  frameEl.appendChild(box);
  titleEl.textContent = "재생 중인 영상 없음";
  markEl.textContent = "--";
  fidEl.textContent = "";
}

/* ---------- 인증 ---------- */
function setAuth(state, text) {
  authEl.dataset.on = state;
  authStateEl.textContent = text;
  signinBtn.textContent = state === "yes" ? "다시 연결" : "연결";
}

function tokenValid() {
  return token && token.value && Date.now() < token.expires - 60000;
}

function initTokenClient() {
  if (!window.google || !google.accounts || !google.accounts.oauth2) return null;
  if (!clientId) return null;
  return google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: SCOPE,
    callback: (res) => {
      if (res.error) {
        setAuth("err", "연결 실패: " + res.error);
        say("Google 연결에 실패했습니다. 클라이언트 ID와 승인된 원본을 확인하세요.", "bad");
        if (pending) { pending.reject(new Error(res.error)); pending = null; }
        return;
      }
      token = { value: res.access_token, expires: Date.now() + (Number(res.expires_in) || 3600) * 1000 };
      setAuth("yes", "Google 계정 연결됨");
      /* 새 토큰은 서비스워커에도 바로 넘긴다 — 안 그러면 재생 중인 영상의 다음 Range 요청이
         여전히 만료된 옛 토큰을 쓴다 */
      postTokenToSW(token.value);
      if (pending) { pending.resolve(token.value); pending = null; }
    },
    /* 팝업이 차단됐거나(사용자 클릭 없이 열려고 할 때) 사용자가 팝업을 닫으면 callback은
       아예 불리지 않는다 — 이걸 안 받으면 getToken()의 Promise가 영원히 안 끝나서
       재생 화면이 아무 안내 없이 멈춰 있었다. */
    error_callback: (err) => {
      const type = (err && err.type) || "unknown";
      setAuth("no", type === "popup_closed" ? "연결 취소됨" : "Google 계정 연결 안 됨");
      if (pending) { pending.reject(new Error(type)); pending = null; }
    }
  });
}

/* 진행 중인 토큰 요청 — 동시에 여러 곳에서 getToken을 불러도 팝업은 하나만 띄우고
   모두 같은 결과를 받는다. (예전엔 나중 요청이 앞 요청의 resolve를 덮어써서
   앞쪽 호출자가 영원히 기다렸다.) */
let pending = null;
function getToken(interactive) {
  if (tokenValid()) return Promise.resolve(token.value);
  if (!clientId) return Promise.reject(new Error("NO_CLIENT_ID"));
  if (!tokenClient) tokenClient = initTokenClient();
  if (!tokenClient) return Promise.reject(new Error("GSI_NOT_READY"));
  if (pending) return pending.promise;
  let resolve, reject;
  const promise = new Promise((a, b) => { resolve = a; reject = b; });
  pending = { promise, resolve, reject };
  tokenClient.requestAccessToken({ prompt: interactive ? "consent" : "" });
  return promise;
}

/* 서비스워커가 토큰을 다시 달라고 할 때 답한다(sw.js의 askToken 참고).
   브라우저는 한가한 서비스워커를 수시로 내렸다가 다시 띄우는데 그때 sw.js의 전역 변수
   token이 날아간다 — 영상을 일시정지했다가 한참 뒤 다시 재생하면 401로 멈출 수 있었다. */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("message", (e) => {
    if (e.data && e.data.type === "need-token" && e.ports && e.ports[0]) {
      e.ports[0].postMessage({ value: tokenValid() ? token.value : null });
    }
  });
  navigator.serviceWorker.startMessages();
}

signinBtn.addEventListener("click", () => {
  if (!clientId) {
    $("#setupBox").open = true;
    say("먼저 OAuth 클라이언트 ID를 저장하세요.", "bad");
    return;
  }
  setAuth("no", "연결 중…");
  getToken(true).catch((err) => {
    if (String(err.message) === "popup_failed_to_open") {
      say("브라우저가 Google 로그인 팝업을 차단했습니다. 주소창의 팝업 차단을 해제한 뒤 다시 눌러 주세요.", "bad");
    }
  });
});

/* ---------- 폴더 읽기 ---------- */
async function listFolder(folderId, depth, out) {
  if (depth > MAX_DEPTH) return out;
  let pageToken = "";
  const subfolders = [];
  do {
    const q = "'" + folderId + "' in parents and trashed = false and " +
      "(mimeType contains 'video/' or mimeType contains 'audio/' or mimeType = 'application/vnd.google-apps.folder')";
    const url = API
      + "?q=" + encodeURIComponent(q)
      + "&fields=" + encodeURIComponent("nextPageToken,files(id,name,mimeType,modifiedTime,size,videoMediaMetadata(durationMillis))")
      + "&orderBy=name&pageSize=200&supportsAllDrives=true&includeItemsFromAllDrives=true"
      + (pageToken ? "&pageToken=" + encodeURIComponent(pageToken) : "");

    /* 하위 폴더를 동시에 읽으므로, 다른 갈래가 401을 받아 token을 지웠을 수도 있다 */
    const res = await fetch(url, { headers: { Authorization: "Bearer " + (token ? token.value : "") } });
    if (res.status === 401) { token = null; throw new Error("UNAUTHORIZED"); }
    if (res.status === 404) throw new Error("NOT_FOUND");
    if (!res.ok) {
      let detail = "";
      try { const e = await res.json(); detail = e.error && e.error.message ? e.error.message : ""; } catch {}
      throw new Error("API_" + res.status + (detail ? ": " + detail : ""));
    }
    const data = await res.json();
    for (const f of (data.files || [])) {
      if (f.mimeType === "application/vnd.google-apps.folder") {
        subfolders.push(f.id);
      } else {
        /* Drive는 트랜스코딩을 끝낸 영상에만 videoMediaMetadata를 채운다.
           값이 없으면 "아직 처리 중인 동영상입니다"가 뜨는 파일이라 재생되지 않는다. */
        const meta = f.videoMediaMetadata;
        const isAudio = f.mimeType.indexOf("audio/") === 0;
        out.push({
          name: f.name,
          id: f.id,
          kind: isAudio ? "audio" : "video",
          ms: meta && meta.durationMillis,
          ready: isAudio || !!(meta && meta.durationMillis),
          mtime: f.modifiedTime ? Date.parse(f.modifiedTime) : 0,   /* 최신순 정렬용 */
          size: Number(f.size) || 0   /* 스트리밍용 — sw.js가 Content-Range를 직접 만들 때 총 크기가 필요하다 */
        });
      }
    }
    pageToken = data.nextPageToken || "";
  } while (pageToken);
  /* 하위 폴더는 동시에 읽는다 — '일반 동영상 전체'처럼 East/West/Classic/China를 한 번에
     훑을 때 하나씩 기다리면 그만큼 오래 걸린다. 어차피 다 읽은 뒤 정렬하므로 순서는 상관없다. */
  await Promise.all(subfolders.map((id) => listFolder(id, depth + 1, out)));
  return out;
}

/* 폴더 ID 하나를 실제로 읽어 재생목록에 채우는 공통 로직 — 기존 '폴더 불러오기'
   버튼과 East/West/China 빠른 폴더 버튼이 함께 쓴다(2026-09-18 리팩터).
   addressToRemember는 다음 방문 때 '폴더 주소' 칸에 복원할 값(=dp.folderId). */
async function runLoad(folderId, addressToRemember, label) {
  if (!clientId) {
    $("#setupBox").open = true;
    say("먼저 OAuth 클라이언트 ID를 저장하세요.", "bad");
    return;
  }

  const buttons = [$("#load"), ...quickMenuButtons];
  buttons.forEach((b) => { b.disabled = true; });
  say("");
  /* 큰 폴더는 몇 초 걸린다 — 안내 줄은 오류 전용이라, 대신 재생목록 개수 자리에 진행 중임을 띄운다 */
  countEl.textContent = "불러오는 중…";

  try {
    await getToken(false);
    const found = await listFolder(folderId, 0, []);
    sortClips(found);

    if (!found.length) {
      say("폴더에서 재생 가능한 미디어 파일을 찾지 못했습니다.", "bad");
      return;
    }

    CLIPS = found;
    loadedLabel = label || "직접 연 폴더";
    $("#folder").value = addressToRemember;
    store.set("dp.folderId", addressToRemember);
    $("#folderBox").open = false;   /* 다 불러왔으면 접어서 목록에 자리를 내줍니다 */
    render();
    updateTransport();

    /* Drive가 변환하지 못한 영상이 섞여 있으면 몇 개인지 미리 알려준다.
       모르고 눌렀다가 "처리 중" 안내만 보는 일을 줄이기 위해서다. */
    const stuck = found.filter((c) => c.ready === false).length;
    const tail = stuck ? " (" + stuck + "개는 드라이브 변환이 끝나지 않아 재생할 수 없습니다)" : "";
    say(found.length + "개를 불러왔습니다." + (shuffleOn ? " 랜덤 재생 중입니다." : "") + tail,
        stuck ? undefined : "ok");

    /* 첫 곡은 재생 가능한 것으로 고른다 */
    if (shuffleOn) {
      buildQueue(-1);
      qpos = 0;
      const firstOk = queue.findIndex((idx) => playable(idx));
      if (firstOk >= 0) { qpos = firstOk; play(queue[firstOk], true); }
      else play(queue[0], true);
    } else {
      const firstOk = found.findIndex((_, i) => playable(i));
      play(firstOk >= 0 ? firstOk : 0);
    }
  } catch (err) {
    const msg = String(err.message || err);
    if (msg === "UNAUTHORIZED") {
      setAuth("no", "연결이 만료됨");
      say("연결이 만료됐습니다. ‘연결’을 다시 눌러 주세요.", "bad");
    } else if (msg === "NOT_FOUND") {
      say("폴더를 찾을 수 없습니다. 폴더 접근 권한이 있는 계정으로 연결했는지 확인하세요.", "bad");
    } else if (msg === "NO_CLIENT_ID" || msg === "GSI_NOT_READY") {
      say("Google 로그인 모듈이 준비되지 않았습니다. 새로고침 후 다시 시도하세요.", "bad");
    } else {
      say("불러오기 실패 — " + msg, "bad");
    }
  } finally {
    buttons.forEach((b) => { b.disabled = false; });
    if (countEl.textContent === "불러오는 중…") render();   /* 실패했으면 개수 표시를 원래대로 */
  }
}

/* 영상 카테고리 — 2026-11-18 리뉴얼. 예전엔 '드라이브 폴더' 메뉴 안에 드롭다운으로 숨어 있던 것을
   목록으로 꺼냈다: 상단 바의 카테고리 탭(큰 묶음) → 그 아래 세그먼티드 컨트롤(하위 폴더) →
   오른쪽 재생목록(영상) 순서로 고르고 본다. 탭·세그먼트는 QUICK_GROUPS 를 순회해 만든다 —
   손으로 다시 적으면 카테고리를 추가할 때 한쪽만 바뀌어 조용히 어긋난다(스타일 가이드 17.3).
   '전체'가 첫 항목이자 탭을 눌렀을 때의 기본 선택이다. 하위 폴더가 없는 카테고리는 세그먼트 줄을 감춘다. */
const quickMenuButtons = [];      /* 불러오는 동안 잠글 버튼들 (runLoad 참고) */
const catsEl = $("#cats"), segEl = $("#seg"), segInd = $("#segInd");
let sel = { g: -1, c: -1 };       /* 고른 카테고리(g)와 하위(c, -1 = 전체) */

function selName(g, c) {
  const group = QUICK_GROUPS[g];
  if (!group) return "";
  return c >= 0 ? group.name + " · " + group.children[c].name : group.name + (group.children ? " · 전체" : "");
}

function moveIndicator(instant) {
  const on = segEl.querySelector(".seg-b.is-on");
  if (!on || !on.offsetWidth) { segInd.style.width = "0"; return; }
  segInd.classList.toggle("is-instant", !!instant);
  segInd.style.left = on.offsetLeft + "px";
  segInd.style.width = on.offsetWidth + "px";
  if (instant) { void segInd.offsetWidth; segInd.classList.remove("is-instant"); }
  /* 좁은 화면에선 세그먼트·탭 줄이 가로로 스크롤된다 — 고른 항목이 밖으로 밀려 있으면 가운데로 데려온다 */
  const center = (box, el) => {
    if (box.scrollWidth <= box.clientWidth) return;
    box.scrollLeft = el.offsetLeft - (box.clientWidth - el.offsetWidth) / 2;
  };
  center(segEl, on);
  const tab = catsEl.querySelector(".cat.is-on");
  if (tab) center(catsEl, tab);
}

function paintSelection(instant) {
  catsEl.querySelectorAll(".cat").forEach((b, i) => {
    const on = i === sel.g;
    b.classList.toggle("is-on", on);
    b.setAttribute("aria-selected", String(on));
  });
  const group = QUICK_GROUPS[sel.g];
  const hasSub = !!(group && group.children && group.children.length);
  $("#subbar").hidden = !hasSub;
  segEl.querySelectorAll(".seg-b").forEach((b) => b.remove());
  if (!hasSub) return;
  $("#subTitle").textContent = group.name;
  [{ name: "전체", id: group.id }].concat(group.children).forEach((child, k) => {
    const c = k - 1;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "seg-b" + (c === sel.c ? " is-on" : "");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(c === sel.c));
    b.tabIndex = c === sel.c ? 0 : -1;
    b.textContent = child.name;
    b.addEventListener("click", () => choose(sel.g, c));
    segEl.appendChild(b);
  });
  moveIndicator(instant);
}

/* 카테고리를 고르면 바로 불러와 재생한다. 이미 고른 것을 다시 눌러도 다시 불러온다
   (첫 화면에선 아무것도 불러오지 않은 상태라 그 한 번이 필요하다). */
function choose(g, c) {
  const group = QUICK_GROUPS[g];
  if (!group) return;
  const prevG = sel.g;
  sel = { g, c };
  paintSelection(prevG !== g);
  const id = c >= 0 ? group.children[c].id : group.id;
  runLoad(id, driveFolderUrl(id), selName(g, c));
}

QUICK_GROUPS.forEach((group, g) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "cat";
  b.setAttribute("role", "tab");
  b.setAttribute("aria-selected", "false");
  b.textContent = group.name;
  b.addEventListener("click", () => choose(g, -1));
  quickMenuButtons.push(b);
  catsEl.appendChild(b);
});

/* 세그먼트 키보드 — ←/→/Home/End (role=tablist) */
segEl.addEventListener("keydown", (e) => {
  const btns = [...segEl.querySelectorAll(".seg-b")];
  const i = btns.indexOf(document.activeElement);
  if (i < 0) return;
  let j = -1;
  if (e.key === "ArrowRight") j = Math.min(btns.length - 1, i + 1);
  else if (e.key === "ArrowLeft") j = Math.max(0, i - 1);
  else if (e.key === "Home") j = 0;
  else if (e.key === "End") j = btns.length - 1;
  if (j < 0) return;
  e.preventDefault(); e.stopPropagation();
  btns[j].focus();
  btns[j].click();
});
window.addEventListener("resize", () => moveIndicator(true));
/* 웹폰트가 늦게 들어오면 글자 폭이 바뀌어 캡슐 폭이 어긋난다 — 다 들어온 뒤 다시 잰다 */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => moveIndicator(true));

/* 로고 = 처음 화면 버튼. 재생 중인 영상은 끊지 않고, 열린 메뉴를 닫고 맨 위로 올린다. */
$("#brand").addEventListener("click", () => {
  document.querySelectorAll(".menu[open]").forEach((d) => { d.open = false; });
  window.scrollTo(0, 0);
  listEl.scrollTop = 0;
  scrollToCurrent();
});

$("#load").addEventListener("click", () => {
  const folderId = parseFolderId($("#folder").value);
  if (!folderId) {
    say("폴더 링크에서 ID를 찾지 못했습니다. 폴더 주소 전체를 붙여넣어 주세요.", "bad");
    return;
  }
  /* 주소로 직접 연 폴더는 어느 카테고리도 아니다 — 탭 선택을 지운다 */
  sel = { g: -1, c: -1 };
  paintSelection();
  runLoad(folderId, $("#folder").value.trim(), "직접 연 폴더");
});

$("#clear").addEventListener("click", () => {
  CLIPS = [];
  queue = []; qpos = -1;
  loadedLabel = "";
  sel = { g: -1, c: -1 };
  paintSelection();
  $("#folderBox").open = false;
  render();
  updateTransport();
  showEmpty("카테고리를 골라 주세요", "위쪽 카테고리를 누르면 그 안의 영상이 모두 재생목록에 올라오고 바로 재생됩니다.");
  say("");
});

$("#folder").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#load").click(); });

/* ---------- 헤더 드롭다운 ---------- */
/* 화면 위에 떠 있는 메뉴라 바깥을 누르면 닫히는 편이 자연스럽습니다. */
document.addEventListener("click", (e) => {
  document.querySelectorAll(".menu[open]").forEach((d) => {
    if (!d.contains(e.target)) d.open = false;
  });
});
/* 한 번에 하나만 열리도록 합니다.
   바람의 검심 드롭다운(.qmenu)처럼 메뉴 안에 메뉴가 중첩된 경우(2026-09-23)도 있어서,
   자기 자신을 담고 있는 조상 메뉴는 닫지 않는다 — 안 그러면 하위 드롭다운을 여는 순간
   그걸 담고 있는 '드라이브 폴더' 패널 자체가 같이 닫혀버린다. */
document.querySelectorAll(".menu").forEach((d) => {
  d.addEventListener("toggle", () => {
    if (!d.open) return;
    document.querySelectorAll(".menu[open]").forEach((o) => {
      if (o !== d && !o.contains(d)) o.open = false;
    });
  });
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const open = document.querySelector(".menu[open]");
  if (open) { open.open = false; open.querySelector("summary").focus(); }
});

/* ---------- 검색 ---------- */
function applyFilter(v) {
  filter = (v || "").trim().toLowerCase();
  $("#qx").hidden = !filter;
  render();
}
$("#q").addEventListener("input", (e) => applyFilter(e.target.value));
$("#q").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { $("#q").value = ""; applyFilter(""); }
});
$("#qx").addEventListener("click", () => {
  $("#q").value = "";
  applyFilter("");
  $("#q").focus();
});

/* ---------- 정렬 전환 ---------- */
$("#sort").addEventListener("click", () => {
  sortBy = sortBy === "recent" ? "name" : "recent";
  store.set("dp.sort", sortBy);
  setSortLabel();
  applySort();
  say(sortBy === "recent" ? "최근 수정 순으로 정렬했습니다." : "이름 순으로 정렬했습니다.");
});

/* ---------- 재생목록 접기 ---------- */
function setRail(open) {
  railOpen = open;
  document.body.dataset.rail = open ? "on" : "off";
  $("#railBtn").setAttribute("aria-expanded", String(open));
  store.set("dp.rail", open ? "1" : "0");
  /* 접혀 있는 동안 바뀐 현재 항목은 목록 밖에 있으므로 다시 가운데로 데려옵니다 */
  if (open) scrollToCurrent();
}
$("#railBtn").addEventListener("click", () => {
  setRail(!railOpen);
  say(railOpen ? "재생목록을 펼쳤습니다." : "재생목록을 접었습니다.");
});

/* ---------- 셔플 / 이전 / 다음 ---------- */
$("#shuffle").addEventListener("click", () => {
  shuffleOn = !shuffleOn;
  $("#shuffle").setAttribute("aria-pressed", String(shuffleOn));
  store.set("dp.shuffle", shuffleOn ? "1" : "0");
  if (shuffleOn) buildQueue(current);
  else { queue = []; qpos = -1; }
  say(shuffleOn ? "랜덤 재생을 켰습니다." : "순서대로 재생합니다.");
});
$("#prev").addEventListener("click", () => step(-1));
$("#next").addEventListener("click", () => step(1));

/* 입력창에 타이핑 중일 때는 방해하지 않습니다.
   영상에 포커스가 있을 때도 마찬가지 — 재생 컨트롤을 한 번 누르면 포커스가 영상으로 가고,
   그때 ←/→는 브라우저 기본 동작(5초 앞뒤 탐색)이어야 합니다. 예전엔 여기서 가로채서
   탐색하려다 곡이 통째로 넘어갔습니다. 수정키 조합(Alt+← 뒤로 가기 등)도 건드리지 않습니다. */
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "VIDEO" || t.tagName === "AUDIO")) return;
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
});

/* ---------- 클라이언트 ID 저장 ---------- */
$("#saveCid").addEventListener("click", () => {
  const v = $("#cid").value.trim();
  if (v && !/\.apps\.googleusercontent\.com$/.test(v)) {
    say("클라이언트 ID 형식이 아닙니다. .apps.googleusercontent.com 으로 끝나야 합니다.", "bad");
    return;
  }
  clientId = v;
  store.set("dp.clientId", v);
  tokenClient = null;
  token = null;
  setAuth("no", v ? "Google 계정 연결 안 됨" : "클라이언트 ID 없음");
  say(v ? "저장했습니다. ‘연결’을 눌러 로그인하세요." : "클라이언트 ID를 비웠습니다.", v ? "ok" : undefined);
});

/* ---------- 시작 ---------- */
setAuth("no", clientId ? "Google 계정 연결 안 됨" : "클라이언트 ID 없음");
/* 기본값은 랜덤 재생. 사용자가 끄면 그 선택이 저장돼 다음에도 유지됩니다. */
shuffleOn = store.get("dp.shuffle", "1") === "1";
/* 드롭다운은 화면 위에 떠 있으므로 시작할 때는 접어 둡니다.
   폴더를 넣어야 한다는 안내는 재생 화면 가운데에 있습니다. */
$("#shuffle").setAttribute("aria-pressed", String(shuffleOn));
sortBy = store.get("dp.sort", "name") === "recent" ? "recent" : "name";
setSortLabel();
/* 기본은 펼침. 접어 두면 그 선택이 저장돼 다음에도 유지됩니다. */
setRail(store.get("dp.rail", "1") === "1");
render();
updateTransport();
if (CLIPS.length) {
  if (shuffleOn) { buildQueue(-1); qpos = 0; play(queue[0], true); }
  else play(0);
}
</script>
</body>
</html>
